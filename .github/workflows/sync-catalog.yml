name: Sync app catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Google Sheet
        env:
          SHEET_CSV: "https://docs.google.com/spreadsheets/d/1wDXCt_fx0EdkjHbaHwDvnoZA__5_OAWYT5sPZ1mhRiU/gviz/tq?tqx=out:csv"
        run: |
          curl -L --fail --silent --show-error "$SHEET_CSV" -o /tmp/catalog.csv

      - name: Build catalog.json
        run: |
          python - <<'PY'
          import csv, json, pathlib
          src = pathlib.Path("/tmp/catalog.csv")
          out = pathlib.Path("catalog.json")
          with src.open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          clean = lambda v: (v or "").strip()
          data = []
          for r in rows:
              name = clean(r.get("name"))
              if not name:
                  continue
              data.append({
                  "name": name,
                  "category": clean(r.get("category")) or "apps",
                  "version": clean(r.get("version")) or "Latest",
                  "size": clean(r.get("size")) or "—",
                  "description": clean(r.get("description")) or "Available release",
                  "icon": clean(r.get("icon")),
                  "link": clean(r.get("link")),
                  "date": clean(r.get("date")) or clean(r.get("updated"))
              })
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Synced {len(data)} catalog items")
          PY

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "chore: sync app catalog"
            git push
          fi
