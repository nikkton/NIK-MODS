<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>NIK MODS — Android Apps, Games & Tools</title>
<link rel="icon" href="assets/nik-logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="noise"></div><div class="blood-bg"></div>
<header class="topbar">
  <a class="brand" href="./"><img src="assets/nik-logo.svg" alt="NIK"><span>NIK MODS</span></a>
  <nav>
    <a class="active" href="./">⌂ <span>Home</span></a><a href="#apps">▦ <span>Apps</span></a><a href="#games">🎮 <span>Games</span></a><a href="#tools">⚒ <span>Tools</span></a><a href="#updates">♨ <span>Updates</span></a>
  </nav>
  <div class="top-search">⌕<input id="topSearch" placeholder="Search..." autocomplete="off"></div>
  <button class="menu" aria-label="Menu">☰</button>
</header>

<main>
<section class="hero">
  <div class="hero-scene" aria-hidden="true">
    <div class="scene-ring"></div><div class="scene-grid"></div>
    <img src="assets/nik-logo.svg" alt="">
    <div class="scene-glow"></div>
  </div>
  <div class="hero-content">
    <p class="eyebrow">ANDROID • APPS • GAMES • TOOLS</p>
    <h1>Everything you need.<br><span>Nothing extra.</span></h1>
    <p class="hero-copy">A dark, fast and clean home for useful Android releases.</p>
    <div class="hero-search">⌕<input id="heroSearch" placeholder="Search apps, games, tools..." autocomplete="off"></div>
    <div class="filters" id="filters">
      <button class="active" data-filter="all">✦ All</button><button data-filter="apps">▦ Apps</button><button data-filter="games">🎮 Games</button><button data-filter="tools">⚒ Tools</button><button data-filter="updates">♨ Updates</button>
    </div>
  </div>
</section>

<section class="catalog" id="apps">
  <div class="section-head"><div><p class="eyebrow">LATEST RELEASES</p><h2>Fresh drops</h2></div><span id="count">—</span></div>
  <div id="status" class="status"><span class="loader"></span><span>Loading releases...</span></div>
  <div id="grid" class="grid"></div>
</section>
</main>

<footer><span>© <span id="year"></span> NIK MODS</span><span>Only distribute files you have the right to distribute.</span></footer>
<script src="script.js?v=4" defer></script>
</body>
</html>
